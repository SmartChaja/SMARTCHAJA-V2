buildscript {
    ext {
        kotlin_version = '2.1.21' // Specify the Kotlin version here
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.10.0" // Adjust based on your project requirements
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" // Apply the Kotlin version
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
