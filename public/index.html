<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download SmartChaja App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 40px 32px;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
      display: inline-block;
    }

    h1 { font-size: 1.6rem; color: #1A1A2E; margin-bottom: 8px; }
    p  { color: #6b7280; font-size: 0.95rem; line-height: 1.5; margin-bottom: 32px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }

    .btn-android { background: #01875f; color: #fff; }
    .btn-ios     { background: #1A1A2E; color: #fff; }

    .qr-section { margin-top: 32px; border-top: 1px solid #e5e7eb; padding-top: 28px; }
    .qr-section p { margin-bottom: 12px; }
    .qr-section img { width: 180px; height: 180px; border-radius: 12px; border: 2px solid #e5e7eb; }

    .footer { margin-top: 28px; font-size: 0.8rem; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <div id="lottie-logo"></div>
    </div>

    <h1>SmartChaja</h1>
    <p>Download the SmartChaja app to manage your charging sessions easily.</p>

    <!-- Store buttons -->
    <a id="btn-android" class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.tjrsmartchaja.smartchaja" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M3.18 23.76c.34.19.72.24 1.09.14l.1-.06 9.35-9.35-2.25-2.25-8.29 11.52zM20.84 10.4 17.7 8.6l-2.52 2.52 2.52 2.52 3.16-1.82a1.25 1.25 0 0 0 0-2.42zM4.27.1A1.24 1.24 0 0 0 3.18.24L11.47 9.5l2.25-2.25L4.37.16 4.27.1zM2.5 1.25a1.24 1.24 0 0 0-.5.98v19.54c0 .4.19.76.5.98l.09.06 10.95-10.95v-.26L2.59 1.19 2.5 1.25z"/></svg>
      Get it on Google Play
    </a>

    <a id="btn-ios" class="btn btn-ios" href="https://apps.apple.com/app/id6756839159" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/></svg>
      Download on the App Store
    </a>

    <!-- QR Code (generated by the Cloud Function) -->
    <div class="qr-section">
      <p>Scan to download on your phone</p>
      <img src="/qr?size=300" alt="QR Code – Download SmartChaja" loading="lazy" />
    </div>

    <p class="footer">© 2026 SmartChaja – TJR Solutions</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    // Load the SmartChaja Lottie logo (same as splash screen)
    lottie.loadAnimation({
      container: document.getElementById('lottie-logo'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: '/power.json'
    });
  </script>
  <script>
    // Auto-redirect on mobile; keep page visible on desktop so QR is shown
    (function () {
      const ua = navigator.userAgent.toLowerCase();
      if (/android/.test(ua)) {
        window.location.href = document.getElementById('btn-android').href;
      } else if (/iphone|ipad|ipod/.test(ua)) {
        window.location.href = document.getElementById('btn-ios').href;
      }
    })();
  </script>
</body>
</html>
